<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,follow" />
<title>Leave a Review · Premier Cabinets Innovations</title>
<!--
  Owned short link: premiercabinetsinnovations.com/review
  Repoint by editing REVIEW_TARGET below. When the Place ID is available,
  swap to the direct write-review dialog:
    https://search.google.com/local/writereview?placeid=PLACE_ID
  No reprint of cards/site needed — only this one line changes.
-->
<link rel="icon" href="/favicon.ico" />
<style>
  :root { --ink:#111111; --paper:#f7f4ee; --gold:#e0b82f; }
  html,body{margin:0;height:100%}
  body{background:var(--ink);color:var(--paper);font-family:'Montserrat',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .box{max-width:420px}
  .box p{font-size:15px;letter-spacing:.02em;opacity:.85;line-height:1.6}
  .box a{color:var(--gold);font-weight:600;text-decoration:none}
  .spin{width:34px;height:34px;margin:0 auto 18px;border:3px solid rgba(245,243,238,.25);
    border-top-color:var(--gold);border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
<script>
  var REVIEW_TARGET = "https://www.google.com/search?q=Premier+Cabinets+Innovation+LLC+Reviews";
  // Fire a tracked event if Google Analytics is present, then redirect.
  try { if (typeof gtag === "function") { gtag("event", "review_click", { event_category: "engagement", event_label: "review_short_link" }); } } catch (e) {}
  window.location.replace(REVIEW_TARGET);
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://www.google.com/search?q=Premier+Cabinets+Innovation+LLC+Reviews" /></noscript>
</head>
<body>
  <div class="box">
    <div class="spin" aria-hidden="true"></div>
    <p>Taking you to leave a review for Premier Cabinets Innovations…<br />
       <a href="https://www.google.com/search?q=Premier+Cabinets+Innovation+LLC+Reviews">Click here if you are not redirected.</a></p>
  </div>
</body>
</html>
